# ==============================================================================
# CustomCobbleGen Configuration
# ==============================================================================
# WARNING: DO NOT EDIT THIS FILE UNLESS YOU KNOW WHAT YOU ARE DOING.
# Use /ccg admin reload in-game after making changes.
# ==============================================================================

options:
  # Enable debug mode to print additional information in the console
  debug: false
  
  # Search radius to find the player who placed the piston/generator
  playerSearchRadius: 4.0
  
  # Should offline players be ignored when loading data from database?
  ignoreOfflinePlayersOnLoad: false
  
  # Auto-save player data to database periodically
  auto-save:
    enabled: false
    delay-in-sec: 300 # 5 minutes
    
  # Use formatted money strings (e.g. 1,000,000 instead of 1000000)
  money:
    format: true
    
  # GUI Settings
  gui:
    permissionNeeded: false
    showBarrierBlockIfLocked: true
    hideInfoIfLocked: false
    confirmpurchases: true
    admingui: true
    seperateClassesByLines: true
    centerTiers: true
    showSupportedModes: true
    custom:
      enabled: false
      size: 27
      
  # Are clickable signs enabled?
  signs:
    enabled: true
    
  # Sound settings when generating blocks
  sounds:
    volume: 2.0
    pitch: 1.0
    
  # Island Plugins (BentoBox, SuperiorSkyblock2, etc.) integration
  islands:
    usePerIslandUnlockedGenerators: false
    sendMessagesToTeam: true
    onlyOwnerCan:
      buy: false
      select: false
    useIslandBalance: false
    
  # Support automation (pistons pushing the generated blocks)
  automation:
    pistons: false
    
  supportWaterloggedBlocks: true
  saveOnTierPurchase: true
  removeGravity: false
  
  # Worlds where the generator will not work
  disabled:
    worlds:
      - "world_the_end"

  # Database settings (Supported types: YAML, MYSQL)
  database:
    type: "YAML"
    host: "localhost:3306"
    database: "database_name"
    table: "CCG_PLAYERS"
    username: "admin"
    password: ""
    
  # ==============================================================================
  # Generation Modes
  # Defines how a generator block is formed.
  # 0 is the default Cobblestone generator.
  # ==============================================================================
  generationModes:
    '0':
      blocks:
        - "WATER"
        - "LAVA"
      displayName: "Cobblestone generator"
      fallback: "COBBLESTONE"
      particleEffect: "SMOKE_LARGE"
      generationSound: "ENTITY_EXPERIENCE_ORB_PICKUP"

  # ==============================================================================
  # Dynamic Generator Options
  # Defines the default buffer (cobblestone minimum)
  # ==============================================================================
  dynamic-generator:
    min-buffer-percentage: 10.0

# ==============================================================================
# Dynamic Generators
# Map modes to their specific ores and upgrades.
# Key '0' corresponds to the Cobblestone generator mode above.
# ==============================================================================
dynamic-generator:
  '0':
    # The default blocks that are generated if no upgrades trigger
    default-rates:
      COBBLESTONE: 95.0
      COAL_ORE: 5.0
      
    # The block that serves as a buffer when total probabilities exceed 100%
    buffer-material: "COBBLESTONE"
    
    # Purchasable Ores and their upgrade paths
    ores:
      DIAMOND_ORE:
        displayName: "&bDiamond Ore"
        icon: "DIAMOND_ORE"
        slot: 4
        # Level 0 -> Unlock
        unlock:
          start-percentage: 1.0
          money: 35000
        # Subsequent Levels
        upgrades:
          '1':
            percentage: 2.0
            money: 50000
          '2':
            percentage: 3.0
            money: 75000
      GOLD_ORE:
        displayName: "&6Gold Ore"
        icon: "PLAYER_HEAD"
        skull: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzEwNzdlODcxZDkxYjdmZWEyNGIxZjY4MDhlMDg4ZDdiODQyZGE1MTZmNjM1NmNlOTE2MTM0OTQ0MzFhZThhMCJ9fX0="
        # Level 0 -> Unlock
        unlock:
          start-percentage: 1.0
          money: 35000
        # Subsequent Levels
        upgrades:
          '1':
            percentage: 2.0
            money: 50000
          '2':
            percentage: 3.0
            money: 75000
